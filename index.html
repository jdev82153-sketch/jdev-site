<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDev Web – Criação de Sites Modernos</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00d4ff;
    --neon2: #0066ff;
    --neon3: #00ffaa;
    --bg: #030b14;
    --bg2: #050f1c;
    --surface: rgba(0,212,255,0.04);
    --border: rgba(0,212,255,0.15);
    --text: #e8f4ff;
    --muted: #6a8fa8;
    --glow: 0 0 20px rgba(0,212,255,0.4), 0 0 60px rgba(0,212,255,0.15);
    --glow2: 0 0 30px rgba(0,102,255,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    width: 12px; height: 12px;
    background: var(--neon);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transition: transform 0.1s;
    box-shadow: var(--glow);
    mix-blend-mode: screen;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid rgba(0,212,255,0.5);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transition: transform 0.15s, width 0.2s, height 0.2s;
  }

  /* CANVAS PARTICLES */
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* GRID OVERLAY */
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 5%;
    background: rgba(3,11,20,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s;
  }
  .nav-logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 1.3rem;
    color: var(--neon);
    text-shadow: var(--glow);
    letter-spacing: 2px;
  }
  .nav-logo span { color: #fff; }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 0.9rem; letter-spacing: 1px; font-weight: 600;
    text-transform: uppercase;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
    height: 1px; background: var(--neon);
    transform: scaleX(0); transition: transform 0.3s;
  }
  .nav-links a:hover { color: var(--neon); }
  .nav-links a:hover::after { transform: scaleX(1); }
  .nav-cta {
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    color: #000 !important; padding: 8px 20px; border-radius: 4px;
    font-weight: 700 !important; font-size: 0.8rem !important;
    transition: box-shadow 0.3s !important;
  }
  .nav-cta:hover { box-shadow: var(--glow) !important; color: #000 !important; }
  .nav-cta::after { display: none !important; }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center;
    position: relative; z-index: 1;
    padding: 120px 5% 80px;
    overflow: hidden;
  }
  .hero-content { max-width: 620px; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,212,255,0.08); border: 1px solid var(--border);
    padding: 6px 16px; border-radius: 30px;
    font-size: 0.75rem; color: var(--neon); letter-spacing: 2px;
    text-transform: uppercase; font-family: 'Space Mono', monospace;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }
  .hero-tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--neon3); box-shadow: 0 0 8px var(--neon3);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 24px;
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .hero h1 .line1 { display: block; color: #fff; }
  .hero h1 .line2 {
    display: block;
    background: linear-gradient(135deg, var(--neon), var(--neon2), var(--neon3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.4));
  }

  .hero-sub {
    font-size: 1.15rem; color: var(--muted); line-height: 1.7;
    margin-bottom: 44px; font-weight: 400;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .hero-sub strong { color: var(--neon); font-weight: 600; }

  .hero-btns {
    display: flex; gap: 16px; flex-wrap: wrap;
    animation: fadeUp 0.8s 0.3s ease both;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    color: #000; padding: 14px 32px; border-radius: 6px;
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 1rem; text-decoration: none; letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(0,102,255,0.4);
    transition: all 0.3s; border: none; cursor: none;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 50px rgba(0,212,255,0.6), 0 8px 30px rgba(0,0,0,0.4);
  }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); color: var(--text);
    padding: 14px 32px; border-radius: 6px;
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 1rem; text-decoration: none; letter-spacing: 1px;
    text-transform: uppercase; background: var(--surface);
    backdrop-filter: blur(10px);
    transition: all 0.3s; cursor: none;
  }
  .btn-outline:hover {
    border-color: var(--neon); color: var(--neon);
    box-shadow: var(--glow); transform: translateY(-3px);
  }

  /* HERO VISUAL */
  .hero-visual {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 55%; max-width: 720px;
    animation: fadeUp 1s 0.4s ease both;
    pointer-events: none;
  }
  .mockup-wrapper {
    position: relative; padding: 20px;
  }
  .mockup-glow {
    position: absolute; inset: -40px;
    background: radial-gradient(ellipse, rgba(0,102,255,0.25) 0%, transparent 70%);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
  .mockup {
    width: 100%; border-radius: 16px;
    border: 1px solid rgba(0,212,255,0.2);
    box-shadow: 0 0 60px rgba(0,102,255,0.3), 0 0 120px rgba(0,212,255,0.1);
    background: #08192b;
    overflow: hidden;
    animation: float 4s ease-in-out infinite;
  }
  .mockup-bar {
    background: #0a1f33; padding: 12px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(0,212,255,0.1);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #ffbd2e; }
  .dot-g { background: #27c93f; }
  .mockup-url {
    flex: 1; background: rgba(255,255,255,0.05); border-radius: 4px;
    padding: 4px 12px; font-family: 'Space Mono', monospace;
    font-size: 0.65rem; color: var(--muted); margin-left: 8px;
  }
  .mockup-body { padding: 0; }
  .mockup-hero-sim {
    background: linear-gradient(135deg, #030b14 0%, #071628 50%, #030b14 100%);
    padding: 28px 24px;
    position: relative; overflow: hidden;
  }
  .mockup-hero-sim::before {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(0,102,255,0.3) 0%, transparent 70%);
  }
  .mockup-tag-sim {
    display: inline-block; background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.2); border-radius: 20px;
    padding: 3px 10px; font-size: 0.55rem; color: var(--neon);
    font-family: 'Space Mono', monospace; margin-bottom: 10px;
  }
  .mockup-h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: 1.1rem; color: #fff; line-height: 1.2; margin-bottom: 8px;
  }
  .mockup-h1 span {
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .mockup-p {
    font-size: 0.6rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5;
  }
  .mockup-btns { display: flex; gap: 8px; }
  .mockup-btn1 {
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    color: #000; padding: 5px 14px; border-radius: 4px;
    font-size: 0.55rem; font-weight: 700; letter-spacing: 0.5px;
  }
  .mockup-btn2 {
    border: 1px solid rgba(0,212,255,0.3); color: var(--neon);
    padding: 5px 14px; border-radius: 4px; font-size: 0.55rem;
  }
  .mockup-cards {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
    padding: 14px;
  }
  .mockup-card {
    background: rgba(0,212,255,0.04); border: 1px solid rgba(0,212,255,0.1);
    border-radius: 8px; padding: 10px; text-align: center;
  }
  .mockup-card-icon { font-size: 1.2rem; margin-bottom: 4px; }
  .mockup-card-title { font-size: 0.55rem; color: var(--neon); font-weight: 700; }
  .mockup-card-text { font-size: 0.5rem; color: var(--muted); margin-top: 2px; }

  /* SECTIONS */
  section { position: relative; z-index: 1; padding: 100px 5%; }
  .section-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: var(--neon); letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .section-tag::before {
    content: '//'; color: var(--neon2); font-weight: 700;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(1.8rem, 4vw, 3rem);
    line-height: 1.1; margin-bottom: 16px;
  }
  .section-title em { font-style: normal; color: var(--neon); }
  .section-sub { color: var(--muted); font-size: 1.05rem; line-height: 1.7; max-width: 560px; }

  /* STATS BAR */
  .stats-bar {
    background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-around; flex-wrap: wrap;
    padding: 40px 5%; gap: 24px; position: relative; z-index: 1;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-family: 'Orbitron', sans-serif; font-size: 2.8rem; font-weight: 900;
    color: var(--neon); text-shadow: var(--glow); display: block;
    line-height: 1;
  }
  .stat-label { color: var(--muted); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; }

  /* ABOUT */
  .about-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
    align-items: center; margin-top: 60px;
  }
  .about-visual {
    position: relative;
  }
  .about-card {
    background: linear-gradient(135deg, rgba(0,102,255,0.08), rgba(0,212,255,0.04));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 40px; position: relative; overflow: hidden;
  }
  .about-card::before {
    content: ''; position: absolute; top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(0,212,255,0.05), transparent 30%);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .about-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900;
    color: #000; margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(0,212,255,0.4);
    position: relative; z-index: 1;
  }
  .about-card-name {
    font-family: 'Orbitron', sans-serif; font-size: 1.3rem;
    color: #fff; margin-bottom: 6px; position: relative; z-index: 1;
  }
  .about-card-role { color: var(--neon); font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 20px; position: relative; z-index: 1; }
  .about-skills { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
  .skill-tag {
    background: rgba(0,212,255,0.08); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
    color: var(--neon); font-family: 'Space Mono', monospace;
  }
  .about-text p {
    color: var(--muted); line-height: 1.8; font-size: 1.05rem; margin-bottom: 20px;
  }
  .about-text strong { color: var(--text); }
  .feature-list { list-style: none; margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  .feature-list li {
    display: flex; align-items: center; gap: 12px;
    color: var(--text); font-size: 1rem;
  }
  .feature-list li::before {
    content: '▸'; color: var(--neon); font-size: 1rem; flex-shrink: 0;
    text-shadow: 0 0 8px var(--neon);
  }

  /* SERVICES */
  .services-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px; margin-top: 60px;
  }
  .service-card {
    background: linear-gradient(135deg, rgba(0,102,255,0.06), rgba(0,212,255,0.03));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 36px 28px; position: relative; overflow: hidden;
    transition: all 0.4s; cursor: none;
  }
  .service-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,212,255,0.08), transparent);
    opacity: 0; transition: opacity 0.4s;
  }
  .service-card:hover { border-color: rgba(0,212,255,0.4); transform: translateY(-8px); }
  .service-card:hover { box-shadow: 0 0 40px rgba(0,102,255,0.2), 0 20px 40px rgba(0,0,0,0.4); }
  .service-card:hover::before { opacity: 1; }
  .service-icon {
    font-size: 2.5rem; margin-bottom: 20px; display: block;
    filter: drop-shadow(0 0 10px rgba(0,212,255,0.5));
  }
  .service-num {
    position: absolute; top: 20px; right: 24px;
    font-family: 'Orbitron', sans-serif; font-size: 2.5rem;
    font-weight: 900; color: rgba(0,212,255,0.06); line-height: 1;
  }
  .service-title {
    font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700;
    color: #fff; margin-bottom: 12px; letter-spacing: 0.5px;
  }
  .service-desc { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }
  .service-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
  .stag {
    background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.15);
    padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
    color: var(--neon); font-family: 'Space Mono', monospace;
  }

  /* BENEFITS */
  .benefits-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px; margin-top: 60px;
  }
  .benefit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 22px;
    text-align: center; transition: all 0.3s; cursor: none;
    position: relative; overflow: hidden;
  }
  .benefit-card::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: linear-gradient(90deg, var(--neon2), var(--neon));
    transform: scaleX(0); transition: transform 0.4s;
  }
  .benefit-card:hover { border-color: rgba(0,212,255,0.3); transform: translateY(-6px); }
  .benefit-card:hover::after { transform: scaleX(1); }
  .benefit-icon { font-size: 2.2rem; margin-bottom: 14px; display: block; }
  .benefit-title { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--neon); margin-bottom: 8px; }
  .benefit-desc { color: var(--muted); font-size: 0.88rem; line-height: 1.6; }

  /* PORTFOLIO */
  .portfolio-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px; margin-top: 60px;
  }
  .portfolio-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; transition: all 0.4s; cursor: none; position: relative;
  }
  .portfolio-card:hover { transform: translateY(-8px); border-color: rgba(0,212,255,0.4); }
  .portfolio-card:hover { box-shadow: 0 0 40px rgba(0,102,255,0.3); }
  .portfolio-thumb {
    height: 180px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #050f1c, #071628);
    display: flex; align-items: center; justify-content: center;
  }
  .portfolio-thumb-inner {
    width: 85%; height: 80%; background: #08192b; border-radius: 8px;
    border: 1px solid rgba(0,212,255,0.15); position: relative; overflow: hidden;
  }
  .thumb-bar { height: 18px; background: #0a1f33; display: flex; align-items: center; padding: 0 10px; gap: 5px; }
  .thumb-dot { width: 6px; height: 6px; border-radius: 50%; }
  .thumb-content { padding: 10px; }
  .thumb-line { height: 5px; border-radius: 3px; margin-bottom: 6px; background: rgba(255,255,255,0.06); }
  .thumb-line.accent { background: linear-gradient(90deg, var(--neon2), var(--neon)); width: 60%; }
  .thumb-line.short { width: 40%; }
  .thumb-blocks { display: flex; gap: 6px; margin-top: 8px; }
  .thumb-block { flex: 1; height: 30px; border-radius: 4px; background: rgba(0,212,255,0.05); border: 1px solid rgba(0,212,255,0.1); }
  .portfolio-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,102,255,0.8), rgba(0,212,255,0.6));
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.4s;
  }
  .portfolio-card:hover .portfolio-overlay { opacity: 1; }
  .overlay-text { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #000; font-weight: 700; letter-spacing: 1px; }
  .portfolio-info { padding: 22px; }
  .portfolio-cat { font-size: 0.7rem; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; font-family: 'Space Mono', monospace; margin-bottom: 6px; }
  .portfolio-title { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #fff; font-weight: 700; }
  .portfolio-sub { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

  /* PROCESS */
  .process-steps {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0; margin-top: 60px; position: relative;
  }
  .process-steps::before {
    content: ''; position: absolute; top: 36px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }
  .process-step { text-align: center; padding: 0 20px; }
  .step-num {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
    color: #000; margin: 0 auto 24px; position: relative; z-index: 1;
    box-shadow: 0 0 30px rgba(0,212,255,0.4);
  }
  .step-title { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #fff; margin-bottom: 10px; }
  .step-desc { color: var(--muted); font-size: 0.88rem; line-height: 1.6; }

  /* INSTAGRAM */
  .instagram-section { text-align: center; }
  .ig-card {
    display: inline-block; max-width: 500px; width: 100%;
    background: linear-gradient(135deg, rgba(131,58,180,0.15), rgba(253,29,29,0.1), rgba(252,176,69,0.1));
    border: 1px solid rgba(200,100,200,0.2); border-radius: 24px;
    padding: 48px 40px; margin-top: 50px;
    transition: all 0.4s; cursor: none;
  }
  .ig-card:hover { transform: translateY(-8px); box-shadow: 0 0 60px rgba(131,58,180,0.3); }
  .ig-icon { font-size: 3.5rem; margin-bottom: 16px; display: block; }
  .ig-handle {
    font-famil
