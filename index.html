<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDev Web — Criação de Sites Modernos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00c8ff;
    --neon2: #0066ff;
    --neon3: #00ffb3;
    --dark: #020510;
    --dark2: #050d1a;
    --card: rgba(0,20,50,0.6);
    --glow: 0 0 20px rgba(0,200,255,0.4), 0 0 60px rgba(0,100,255,0.2);
    --glow-strong: 0 0 30px rgba(0,200,255,0.7), 0 0 80px rgba(0,100,255,0.4), 0 0 120px rgba(0,200,255,0.15);
    --text: #e8f4ff;
    --muted: #6a8aaa;
    --border: rgba(0,200,255,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--neon);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s;
    box-shadow: var(--glow);
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1.5px solid rgba(0,200,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.18s ease;
  }

  /* CANVAS BACKGROUND */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* GRID OVERLAY */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(2,5,16,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s;
  }
  .nav-logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--neon);
    text-shadow: var(--glow);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-logo span { color: #fff; }
  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0; right: 100%;
    height: 1px;
    background: var(--neon);
    box-shadow: var(--glow);
    transition: right 0.3s;
  }
  .nav-links a:hover { color: var(--neon); }
  .nav-links a:hover::after { right: 0; }
  .nav-cta {
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    padding: 9px 22px;
    border-radius: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    box-shadow: 0 0 10px rgba(0,200,255,0.15);
  }
  .nav-cta:hover {
    background: var(--neon);
    color: var(--dark);
    box-shadow: var(--glow-strong);
  }
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }
  .hamburger span {
    width: 24px; height: 2px;
    background: var(--neon);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* SECTIONS */
  section { position: relative; z-index: 1; }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 120px 5% 80px;
    position: relative;
    overflow: hidden;
  }
  .hero-content {
    max-width: 620px;
    position: relative;
    z-index: 2;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: rgba(0,200,255,0.05);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--neon);
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }
  .hero-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--neon);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--neon);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -1px;
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .hero h1 .brand {
    display: block;
    color: var(--neon);
    text-shadow: var(--glow-strong);
  }
  .hero h1 .subtitle-text {
    display: block;
    color: #fff;
    font-size: 0.52em;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .hero-desc {
    margin: 28px 0 44px;
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--muted);
    max-width: 480px;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .hero-desc strong { color: var(--text); }

  .hero-btns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    color: var(--dark);
    padding: 15px 32px;
    border-radius: 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(0,100,255,0.4), 0 0 60px rgba(0,200,255,0.2);
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .btn-primary:hover::before { transform: translateX(100%); }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,100,255,0.6), 0 0 80px rgba(0,200,255,0.3);
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(0,200,255,0.4);
    color: var(--text);
    padding: 15px 32px;
    border-radius: 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-decoration: none;
    transition: all 0.3s;
    background: rgba(0,200,255,0.04);
    backdrop-filter: blur(10px);
  }
  .btn-outline:hover {
    border-color: var(--neon);
    background: rgba(0,200,255,0.1);
    color: var(--neon);
    transform: translateY(-2px);
    box-shadow: var(--glow);
  }

  .hero-mockup {
    position: absolute;
    right: 3%;
    top: 50%;
    transform: translateY(-50%);
    width: 48%;
    max-width: 620px;
    z-index: 1;
    animation: floatIn 1s 0.4s ease both;
  }
  .mockup-wrap {
    position: relative;
  }
  .mockup-glow-bg {
    position: absolute;
    inset: -30%;
    background: radial-gradient(ellipse at center, rgba(0,100,255,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .mockup-frame {
    background: rgba(5,15,35,0.9);
    border: 1px solid rgba(0,200,255,0.25);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,100,255,0.3), 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(0,200,255,0.2);
    backdrop-filter: blur(20px);
  }
  .mockup-topbar {
    background: rgba(0,200,255,0.05);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff4f4f; }
  .dot-y { background: #ffd700; }
  .dot-g { background: #00ff88; }
  .mockup-url {
    margin-left: 12px;
    background: rgba(0,200,255,0.08);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px 14px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .mockup-body {
    padding: 24px 20px;
  }
  .mock-hero-bar {
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    height: 6px;
    border-radius: 3px;
    width: 60%;
    margin-bottom: 14px;
    box-shadow: 0 0 20px rgba(0,200,255,0.5);
  }
  .mock-line { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-bottom: 10px; }
  .mock-line.short { width: 45%; }
  .mock-line.med { width: 70%; }
  .mock-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  .mock-card {
    background: rgba(0,200,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    height: 70px;
  }
  .mock-card-dot {
    width: 20px; height: 20px;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    border-radius: 4px;
    margin-bottom: 8px;
    box-shadow: 0 0 10px rgba(0,200,255,0.4);
  }
  .mock-card-line { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* STATS */
  .hero-stats {
    margin-top: 52px;
    display: flex;
    gap: 40px;
    animation: fadeUp 0.8s 0.5s ease both;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }
  .stat { }
  .stat-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--neon);
    text-shadow: var(--glow);
    display: block;
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* SCROLL INDICATOR */
  .scroll-indicator {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeIn 1s 1s both;
  }
  .scroll-line {
    width: 1px;
    height: 50px;
    background: linear-gradient(to bottom, var(--neon), transparent);
    animation: scrollDown 2s infinite;
  }
  @keyframes scrollDown {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  /* SECTION COMMONS */
  .section-header {
    text-align: center;
    margin-bottom: 64px;
  }
  .section-tag {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--neon);
    margin-bottom: 16px;
    position: relative;
  }
  .section-tag::before, .section-tag::after {
    content: '//';
    margin: 0 8px;
    opacity: 0.5;
  }
  .section-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.1;
    color: #fff;
  }
  .section-title em {
    font-style: normal;
    color: var(--neon);
    text-shadow: var(--glow);
  }
  .section-desc {
    margin-top: 18px;
    color: var(--muted);
    font-size: 1rem;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.7;
  }

  /* SOBRE */
  .sobre {
    padding: 100px 5%;
    position: relative;
  }
  .sobre-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  .sobre-visual {
    position: relative;
  }
  .sobre-avatar-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto;
  }
  .sobre-ring {
    position: absolute;
    inset: -20px;
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 50%;
    animation: spin 20s linear infinite;
  }
  .sobre-ring::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 8px; height: 8px;
    background: var(--neon);
    border-radius: 50%;
    box-shadow: var(--glow);
    transform: translate(-50%, -50%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sobre-ring2 {
    position: absolute;
    inset: -40px;
    border: 1px solid rgba(0,100,255,0.1);
    border-radius: 50%;
    animation: spin 30s linear infinite reverse;
  }
  .sobre-avatar {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--dark2), rgba(0,50,120,0.8));
    border-radius: 50%;
    border: 2px solid rgba(0,200,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 4rem;
    font-weight: 900;
    color: var(--neon);
    text-shadow: var(--glow-strong);
    box-shadow: 0 0 60px rgba(0,100,255,0.4);
    position: relative;
    overflow: hidden;
  }
  .sobre-avatar::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(0,200,255,0.05), transparent 30%);
    animation: spin 8s linear infinite;
  }
  .sobre-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 28px;
    justify-content: center;
  }
  .skill-tag {
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.2);
    color: var(--neon);
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 0.75rem;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .skill-tag:hover {
    background: rgba(0,200,255,0.15);
    box-shadow: 0 0 15px rgba(0,200,255,0.3);
  }

  .sobre-content .section-header { text-align: left; }
  .sobre-content .section-title { font-size: 2.2rem; }
  .sobre-text {
    color: var(--muted);
    line-height: 1.85;
    margin-top: 20px;
    font-size: 1rem;
  }
  .sobre-text strong { color: var(--text); }
  .sobre-features {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sobre-feature {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .sobre-feature:hover {
    border-color: rgba(0,200,255,0.35);
    background: rgba(0,50,120,0.3);
    transform: translateX(6px);
  }
  .feature-icon {
    font-size: 1.4rem;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,200,255,0.1);
    border-radius: 8px;
    flex-shrink: 0;
  }
  .feature-text { font-size: 0.9rem; color: var(--text); font-weight: 500; }

  /* SERVICOS */
  .servicos {
    padding: 100px 5%;
    background: linear-gradient(to bottom, transparent, rgba(0,20,60,0.3), transparent);
  }
  .servicos-inner { max-width: 1100px; margin: 0 auto; }
  .servicos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }
  .servico-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 30px;
    backdrop-filter: blur(20px);
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .servico-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .servico-card:hover::before { transform: translateX(0); }
  .servico-card::after {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(0,200,255,0.08), transparent);
    transition: all 0.4s;
    border-radius: 50%;
  }
  .servico-card:hover { 
    border-color: rgba(0,200,255,0.4);
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(0,50,150,0.4), 0 0 30px rgba(0,200,255,0.1);
    background: rgba(0,30,70,0.7);
  }
  .servico-card:hover::after { bottom: -30px; right: -30px; width: 200px; height: 200px; }
  .servico-icon {
    font-size: 2.4rem;
    margin-bottom: 22px;
    display: block;
    filter: drop-shadow(0 0 10px rgba(0,200,255,0.5));
  }
  .servico-num {
    position: absolute;
    top: 24px; right: 24px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    color: rgba(0,200,255,0.25);
    letter-spacing: 2px;
  }
  .servico-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    color: #fff;
    margin-bottom: 12px;
  }
  .servico-desc {
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.7;
  }
  .servico-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
  }
  .servico-tag {
    background: rgba(0,200,255,0.06);
    border: 1px solid rgba(0,200,255,0.15);
    color: rgba(0,200,255,0.7);
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
  }

  /* BENEFICIOS */
  .beneficios {
    padding: 100px 5%;
  }
  .beneficios-inner { max-width: 1100px; margin: 0 auto; }
  .beneficios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 0;
  }
  .beneficio-card {
    padding: 30px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
    transition: all 0.4s;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .beneficio-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,200,255,0.04), transparent);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .beneficio-card:hover::before { opacity: 1; }
  .beneficio-card:hover {
    border-color: rgba(0,200,255,0.3);
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,50,150,0.3);
  }
  .beneficio-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 12px rgba(0,200,255,0.4));
  }
  .beneficio-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
    margin-bottom: 10px;
  }
  .beneficio-desc {
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.65;
  }

  /* PORTFOLIO */
  .portfolio {
    padding: 100px 5%;
    background: linear-gradient(to bottom, transparent, rgba(0,10,30,0.5), transparent);
  }
  .portfolio-inner { max-width: 1100px; margin: 0 auto; }
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }
  .portfolio-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.4s;
    cursor: pointer;
    position: relative;
  }
  .portfolio-card:hover {
    border-color: rgba(0,200,255,0.4);
    transform: translateY(-8px);
    box-shadow: 0 24px 60px rgba(0,50,150,0.4);
  }
